# Projekt-Konfiguration für das Plugin agent-os-openspec (edit_gate, workflow.py).
# Grund (2026-09-22, Bug #21): Das Edit-Gate erkennt Test-Verzeichnisse nur über exakte
# Segmentnamen. Das UI-Test-Target heißt nach Xcode-Konvention `LeanHealthTimerUITests/`
# und wurde deshalb in der TDD-RED-Phase als App-Code behandelt und blockiert.
# Die Liste ERSETZT die Plugin-Defaults, deshalb stehen diese hier vollständig mit drin.
strict_code_gate:
  always_allowed_dirs:
    - "Tests/"
    - "UITests/"
    - "Test/"
    - "test/"
    - "__tests__/"
    - "tests/"
    - "spec/"
    - "docs/"
    - ".claude/commands/"
    - "scripts/"
    - "tools/"
    - "LeanHealthTimerUITests/"
    - "LeanHealthTimerTests/"

# PO-Entscheidung 2026-11-15 (#80, Epic #48): Die Zeilengrenze (±250 je Runde) gilt nur für Programmcode.
# Übersetzungstexte im String-Katalog zählen nicht mit: festes JSON-Format, rund 16 Zeilen je Text.
# Die Texte werden trotzdem in jeder Runde vollständig geprüft (Tests, Adversary).
scope_guard:
  loc_exclude_patterns:
    - '\.xcstrings$'
    # PO 2026-11-20 („Nur App-Code"): Doku und Werkzeug-Dateien zählen nicht (#51, Gate zählte 341 statt 32 Zeilen).
    - '^DOCS/'
    - '^\.claude/'
  # Die Test-Targets heißen nach Xcode-Konvention `LeanHealthTimerTests/` bzw. `…UITests/`;
  # die Plugin-Vorgabe `(^|/)tests?/` trifft sie nicht, sie zählten als App-Code. Liste ersetzt die Vorgabe.
  test_path_patterns:
    - '(^|/)tests?/'
    - '(^|/)Tests/'
    - '(^|/)LeanHealthTimer(UI)?Tests/'
